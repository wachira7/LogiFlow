# docker-compose.prod.yml
# Production reference for Northflank + Vercel + Redis Cloud
#
# What this file does NOT include (handled externally):
#   - PostgreSQL     → Northflank managed addon (logiflow-db)
#   - Redis          → Redis Cloud free tier
#   - Frontend       → Vercel (auto-deploy on push to main)
#   - Nginx          → Northflank handles SSL termination + reverse proxy
#   - Prometheus     → Set up separately on Oracle Cloud (like FlixVideo)
#   - Grafana        → Set up separately on Oracle Cloud (like FlixVideo)
#
# What runs on Northflank (defined here for reference):
#   - Backend        → Service 1
#   - Celery         → Service 2 (worker + beat combined)
#   - Migrations     → Job (triggered by CI pipeline)

services:

  # ─────────────────────────────────────────
  # Backend — Northflank Service 1
  # ─────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: logiflow_backend_prod
    env_file:
      - .env.production
    environment:
      - DEBUG=False
      - SECURE_SSL_REDIRECT=False
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: >
      gunicorn logistics_project.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout 120
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─────────────────────────────────────────
  # Celery — Northflank Service 2
  # Worker + Beat combined (free tier limit)
  # ─────────────────────────────────────────
  celery:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: logiflow_celery_prod
    env_file:
      - .env.production
    environment:
      - DEBUG=False
    restart: unless-stopped
    command: >
      bash -c "celery -A logistics_project beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler &
      celery -A logistics_project worker -l info --concurrency=4 &
      wait"
    healthcheck:
      test: ["CMD", "celery", "-A", "logistics_project", "inspect", "ping"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ─────────────────────────────────────────
  # Migrations — Northflank Job
  # Run manually or triggered by CI pipeline
  # NOT a long-running service
  # ─────────────────────────────────────────
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: logiflow_migrate
    env_file:
      - .env.production
    environment:
      - DEBUG=False
    command: python manage.py migrate --noinput
    profiles:
      - migration  # only runs when explicitly called:
                   # docker compose --profile migration up migrate