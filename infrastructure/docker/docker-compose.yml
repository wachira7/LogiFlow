# infrastructure/docker/docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:password@db:5432/logiflow
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ../../backend:/app
      - media_volume:/app/media
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    command: yarn dev

  mobile:
    build:
      context: ../../mobile
      dockerfile: ../infrastructure/docker/mobile.Dockerfile
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ../../mobile:/app
      - /app/node_modules
    command: yarn start

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=logiflow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  celery:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:password@db:5432/logiflow
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ../../backend:/app
    command: celery -A logistics_project worker -l info

  celery-beat:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:password@db:5432/logiflow
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ../../backend:/app
    command: celery -A logistics_project beat -l info

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_volume: