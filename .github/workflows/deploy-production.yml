# .github/workflows/deploy-production.yml
name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────
# JOB 1: Build & push Docker images to GHCR
# Both backend and frontend run in parallel
# ─────────────────────────────────────────────
jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

# ─────────────────────────────────────────────
# JOB 2: Run Django migrations on Northflank
# Runs a one-off job against the live DB
# ─────────────────────────────────────────────
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event.inputs.skip_migrations != 'true' }}

    steps:
      - name: Trigger migration job on Northflank
        run: |
          echo "🔄 Triggering migration job on Northflank..."

          RESPONSE=$(curl --silent --show-error --fail \
            --request POST \
            --url "https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/jobs/${{ secrets.NORTHFLANK_MIGRATION_JOB_ID }}/runs" \
            --header "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{
              "overrides": {
                "cmd": "python manage.py migrate --noinput"
              }
            }')

          echo "Response: $RESPONSE"

          JOB_RUN_ID=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
          echo "JOB_RUN_ID=$JOB_RUN_ID" >> $GITHUB_ENV
          echo "✅ Migration job triggered — run ID: $JOB_RUN_ID"

      - name: Wait for migration job to complete
        run: |
          echo "⏳ Polling migration job status..."

          for i in $(seq 1 60); do
            STATUS=$(curl --silent --fail \
              --request GET \
              --url "https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/jobs/${{ secrets.NORTHFLANK_MIGRATION_JOB_ID }}/runs/${{ env.JOB_RUN_ID }}" \
              --header "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['status'])")

            echo "  Status ($i/30): $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Migrations completed successfully!"
              exit 0
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ERROR" ]; then
              echo "❌ Migration job failed!"
              exit 1
            fi

            sleep 10
          done

          echo "❌ Migration job timed out after 10 minutes"
          exit 1

# ─────────────────────────────────────────────
# JOB 3: Deploy backend service on Northflank
# Updates the image tag and triggers redeploy
# ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Northflank
    runs-on: ubuntu-latest
    needs: run-migrations

    steps:
      - name: Deploy Backend → Northflank
        run: |
          IMAGE_TAG="ghcr.io/${{ env.IMAGE_NAME }}/backend:latest"
          echo "🚀 Deploying backend image: $IMAGE_TAG"
          curl --silent --show-error --fail \
            --request POST \
            --url "https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/services/logiflow-backend/deployment" \
            --header "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"external\": {\"imagePath\": \"$IMAGE_TAG\", \"credentials\": \"ghcr-logiflow\"}}"

          echo "✅ Backend redeploy triggered"

      - name: Wait for backend to be healthy
        run: |
          echo "⏳ Waiting for backend health check..."

          for i in $(seq 1 24); do
            HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "${{ secrets.NORTHFLANK_BACKEND_URL }}/api/health/" || echo "000")

            echo "  Attempt $i/24 — HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi

            sleep 10
          done

          echo "❌ Backend health check failed after 4 minutes"
          exit 1

# ─────────────────────────────────────────────
# JOB 4: Deploy Celery worker on Northflank
# Runs in parallel with backend deploy
# ─────────────────────────────────────────────
  deploy-celery:
    name: Deploy Celery Worker → Northflank
    runs-on: ubuntu-latest
    needs: run-migrations

    steps:
      - name: Deploy Celery → Northflank
        run: |
          IMAGE_TAG="ghcr.io/${{ env.IMAGE_NAME }}/backend:latest"
          echo "🔄 Redeploying Celery worker..."
          curl --silent --show-error --fail \
            --request POST \
            --url "https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/services/logiflow-celery/deployment" \
            --header "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"external\": {\"imagePath\": \"$IMAGE_TAG\", \"credentials\": \"ghcr-logiflow\"}}"

          echo "✅ Celery redeploy triggered"

# ─────────────────────────────────────────────
# JOB 5: Vercel deploys automatically via its
# own GitHub integration — no step needed here.
# This job just documents + confirms it.
# ─────────────────────────────────────────────
  confirm-frontend:
    name: Frontend → Vercel (auto-deploy)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Confirm Vercel auto-deploy is active
        run: |
          echo "✅ Vercel deploys automatically on push to main."
          echo "   Monitor at: https://vercel.com/dashboard"
          echo "   No manual trigger needed — Vercel watches this repo directly."

# ─────────────────────────────────────────────
# JOB 6: Final status summary
# ─────────────────────────────────────────────
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-celery, confirm-frontend]
    if: always()

    steps:
      - name: Print deployment summary
        run: |
          echo "════════════════════════════════════"
          echo "  LogiFlow Deployment Summary"
          echo "════════════════════════════════════"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Branch   : ${{ github.ref_name }}"
          echo "  Actor    : ${{ github.actor }}"
          echo "  Time     : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "  Backend  : ${{ needs.deploy-backend.result }}"
          echo "  Celery   : ${{ needs.deploy-celery.result }}"
          echo "  Frontend : ${{ needs.confirm-frontend.result }}"
          echo "════════════════════════════════════"

      - name: Fail if any critical job failed
        if: |
          needs.deploy-backend.result == 'failure' ||
          needs.deploy-celery.result == 'failure'
        run: |
          echo "❌ A critical deployment job failed. Check logs above."
          exit 1