name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      
      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile
      
      - name: Type checking
        run: |
          cd frontend
          yarn tsc --noEmit
        continue-on-error: true
      
      - name: Linting
        run: |
          cd frontend
          yarn lint
        continue-on-error: true
      
      # ⏸️ PRETTIER COMMENTED OUT - Configure formatting rules first
      # - name: Format checking
      #   run: |
      #     cd frontend
      #     yarn prettier --check .
      #   continue-on-error: true
      
      # ⏸️ TESTS COMMENTED OUT - No tests written yet
      # - name: Run tests
      #   run: |
      #     cd frontend
      #     yarn test
      #   env:
      #     CI: true
      
      - name: Build application
        run: |
          cd frontend
          yarn build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000

