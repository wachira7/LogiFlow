# .github/workflows/ci-frontend.yml
name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/.next/cache
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile
      
      - name: Type checking
        run: |
          cd frontend
          yarn tsc --noEmit
      
      - name: Linting
        run: |
          cd frontend
          yarn lint
      
      - name: Format checking
        run: |
          cd frontend
          yarn prettier --check .
        continue-on-error: true
      
      - name: Run tests
        run: |
          cd frontend
          yarn test
        env:
          CI: true
      
      - name: Build application
        run: |
          cd frontend
          yarn build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000

      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1

  lighthouse-audit:
    runs-on: ubuntu-latest
    needs: test-frontend
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      
      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile
      
      - name: Build application
        run: |
          cd frontend
          yarn build
        env:
          NODE_ENV: production
      
      - name: Start application
        run: |
          cd frontend
          yarn start &
          sleep 10
        env:
          PORT: 3000
      
      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './frontend/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      
      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile
      
      - name: Run security audit
        run: |
          cd frontend
          yarn audit --level moderate
        continue-on-error: true
      
      - name: Run dependency check
        run: |
          cd frontend
          npx audit-ci --moderate
        continue-on-error: true

  bundle-analysis:
    runs-on: ubuntu-latest
    needs: test-frontend
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      
      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile
      
      - name: Install bundle analyzer
        run: |
          cd frontend
          yarn add -D @next/bundle-analyzer
      
      - name: Analyze bundle
        run: |
          cd frontend
          ANALYZE=true yarn build
        env:
          NODE_ENV: production
      
      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: frontend/.next/analyze
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest
    needs: test-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      
      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile
      
      - name: Install Playwright
        run: |
          cd frontend
          yarn playwright install
      
      - name: Build application
        run: |
          cd frontend
          yarn build
        env:
          NODE_ENV: production
      
      - name: Start application
        run: |
          cd frontend
          yarn start &
          sleep 10
        env:
          PORT: 3000
      
      - name: Run E2E tests
        run: |
          cd frontend
          yarn test:e2e
      
      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [test-frontend, security-scan]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      
      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile
      
      - name: Build for preview
        run: |
          cd frontend
          yarn build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api-staging.logiflow.com
      
      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        if: github.event_name == 'pull_request'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          
  notification:
    runs-on: ubuntu-latest
    needs: [test-frontend, security-scan, bundle-analysis]
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.test-frontend.result == 'success'
        run: |
          echo "✅ Frontend CI completed successfully!"
          # Add Slack/Discord notification here if needed
      
      - name: Notify on failure
        if: needs.test-frontend.result == 'failure'
        run: |
          echo "❌ Frontend CI failed!"
          # Add Slack/Discord notification here if needed